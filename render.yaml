services:
  - type: web
    name: wuliuqi-shop
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./docker/Dockerfile.app
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: shop
      - key: APP_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false

  - type: web
    name: wuliuqi-admin
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./docker/Dockerfile.app
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: admin
      - key: APP_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: COS_SECRET_ID
        sync: false
      - key: COS_SECRET_KEY
        sync: false
      - key: COS_BUCKET
        sync: false
      - key: COS_REGION
        sync: false
      - key: COS_PUBLIC_BASE_URL
        sync: false
      - key: RAG_DATABASE_URL
        sync: false
      - key: RAG_DB_POOL_SIZE
        value: 5
      - key: RAG_MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: 768

  - type: web
    name: wuliuqi-docs
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./docker/Dockerfile.app
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: docs
      - key: APP_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: RAG_DATABASE_URL
        sync: false
      - key: RAG_DB_POOL_SIZE
        value: 5
      - key: RAG_MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: 768
